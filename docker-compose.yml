# docker-compose.yml (raiz do projeto)
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: roundlog
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
